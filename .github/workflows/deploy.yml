# ============================================
# Print Shop Generator - CI/CD Pipeline
# ============================================
# Este workflow ejecuta tests y deploya a Render.com
#
# Triggers:
#   - Push a main: ejecuta tests + deploy
#   - Pull request a main: solo ejecuta tests
#
# Secrets requeridos:
#   - RENDER_DEPLOY_HOOK_URL: URL del deploy hook de Render
#     (Obtener en: Render Dashboard → Service → Settings → Deploy Hook)
#
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: '3.12'

jobs:
  # ==========================================
  # Job 1: Lint and Test
  # ==========================================
  test:
    name: Lint & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run linter (Ruff)
        run: |
          ruff check backend/ --output-format=github

      - name: Run formatter check (Ruff)
        run: |
          ruff format backend/ --check

      - name: Run tests
        run: |
          pytest backend/tests -v --tb=short

      - name: Run tests with coverage
        run: |
          pytest backend/tests --cov=backend/app --cov-report=term-missing --cov-fail-under=50

  # ==========================================
  # Job 2: Build Docker Image (validation)
  # ==========================================
  build:
    name: Build Docker
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: false
          tags: print-shop-generator:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ==========================================
  # Job 3: Deploy to Render
  # ==========================================
  deploy:
    name: Deploy to Render
    runs-on: ubuntu-latest
    needs: [test, build]

    # Solo deploy en push a main (no en PRs)
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Trigger Render Deploy
        run: |
          echo "🚀 Triggering deployment to Render..."
          response=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}")
          if [ "$response" = "200" ] || [ "$response" = "201" ]; then
            echo "✅ Deploy triggered successfully!"
          else
            echo "❌ Deploy failed with status: $response"
            exit 1
          fi

      - name: Deployment Summary
        run: |
          echo "## 🚀 Deployment Triggered" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch:** main" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit:** ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Actor:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Check deployment status in [Render Dashboard](https://dashboard.render.com)" >> $GITHUB_STEP_SUMMARY
